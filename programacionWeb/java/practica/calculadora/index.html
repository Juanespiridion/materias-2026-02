<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora básica</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eeeeee;
        }

        .calculadora {
            width: 300px;
            padding: 20px;
            border-radius: 12px;
            background-color: #222222;
        }

        #pantalla {
            width: 100%;
            height: 60px;
            margin-bottom: 15px;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background-color: #ffffff;
            font-size: 28px;
            text-align: right;
        }

        .botones {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            min-height: 50px;
            border: none;
            border-radius: 6px;
            background-color: #555555;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            background-color: #777777;
        }

        .operador {
            background-color: #e6812f;
        }

        .limpiar {
            background-color: #777777;
            grid-column: span 3;
        }

        .cero {
            grid-column: span 2;
        }

        .igual {
            background-color: #2c9c5b;
        }
    </style>
</head>
<body>
    <main class="calculadora">
        <input id="pantalla" type="text" value="0" readonly aria-label="Pantalla de la calculadora">

        <div class="botones">
            <button class="limpiar" onclick="limpiar()">AC</button>
            <button class="operador" onclick="elegirOperacion('/')">÷</button>

            <button onclick="agregarNumero('7')">7</button>
            <button onclick="agregarNumero('8')">8</button>
            <button onclick="agregarNumero('9')">9</button>
            <button class="operador" onclick="elegirOperacion('*')">×</button>

            <button onclick="agregarNumero('4')">4</button>
            <button onclick="agregarNumero('5')">5</button>
            <button onclick="agregarNumero('6')">6</button>
            <button class="operador" onclick="elegirOperacion('-')">−</button>

            <button onclick="agregarNumero('1')">1</button>
            <button onclick="agregarNumero('2')">2</button>
            <button onclick="agregarNumero('3')">3</button>
            <button class="operador" onclick="elegirOperacion('+')">+</button>

            <button class="cero" onclick="agregarNumero('0')">0</button>
            <button onclick="agregarDecimal()">.</button>
            <button class="igual" onclick="calcular()">=</button>
        </div>
    </main>

    <script>
        const pantalla = document.getElementById("pantalla");
        let primerNumero = 0;
        let operacion = "";
        let nuevoNumero = true;

        function agregarNumero(numero) {
            if (nuevoNumero || pantalla.value === "0") {
                pantalla.value = numero;
                nuevoNumero = false;
            } else {
                pantalla.value += numero;
            }
        }

        function agregarDecimal() {
            if (nuevoNumero) {
                pantalla.value = "0.";
                nuevoNumero = false;
            } else if (!pantalla.value.includes(".")) {
                pantalla.value += ".";
            }
        }

        function elegirOperacion(signo) {
            if (pantalla.value === "Error") {
                return;
            }

            primerNumero = Number(pantalla.value);
            operacion = signo;
            nuevoNumero = true;
        }

        function calcular() {
            const segundoNumero = Number(pantalla.value);
            let resultado;

            if (operacion === "+") {
                resultado = primerNumero + segundoNumero;
            } else if (operacion === "-") {
                resultado = primerNumero - segundoNumero;
            } else if (operacion === "*") {
                resultado = primerNumero * segundoNumero;
            } else if (operacion === "/") {
                if (segundoNumero === 0) {
                    pantalla.value = "Error";
                    operacion = "";
                    nuevoNumero = true;
                    return;
                }
                resultado = primerNumero / segundoNumero;
            } else {
                return;
            }

            pantalla.value = resultado;
            operacion = "";
            nuevoNumero = true;
        }

        function limpiar() {
            pantalla.value = "0";
            primerNumero = 0;
            operacion = "";
            nuevoNumero = true;
        }
    </script>
</body>
</html>
