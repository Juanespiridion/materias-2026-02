<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de Grid</title>
    <style>
        .grid-container {
            display: grid;
            /*grid-template-columns: repeat(3, 1fr); /* Crea 3 columnas iguales */
            /*gap: 10px; /* Espacio entre las celdas */ 
            
            grid-template-columns: 50px 300px 100px;
            grid-template-rows: 200px 75px;
        }
        .grid-item {
            background-color: lightblue;
            padding: 20px;
            text-align: center;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-item">Elemento 1</div>
        <div class="grid-item">Elemento 2</div>
        <div class="grid-item">Elemento 3</div>
        <div class="grid-item">Elemento 4</div>
        <div class="grid-item">Elemento 5</div>
        <div class="grid-item">Elemento 6</div>
        <div class="grid-item">Elemento 6</div>
        <div class="grid-item">Elemento 6</div>
        <div class="grid-item">Elemento 6</div>
        <div class="grid-item">Elemento 6</div>
        <div class="grid-item">Elemento 6</div>
    </div>
</body>
</html>
